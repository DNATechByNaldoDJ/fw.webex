name: Release Automation Checks

on:
  pull_request:
    paths:
      - 'scripts/release_freeze.sh'
      - 'scripts/tests/**'
      - '.github/workflows/release-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release_freeze.sh'
      - 'scripts/tests/**'
      - '.github/workflows/release-*.yml'

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n scripts/release_freeze.sh
      - name: Test release flow with local remotes
        run: python3 -m unittest discover -s scripts/tests -v
