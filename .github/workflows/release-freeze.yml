name: Release Freeze Automation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to freeze, without prefix (example: 1.0.3)"
        required: true
        type: string
      base_branch:
        description: "Branch used as the release source"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  freeze-and-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run freeze automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BASE_BRANCH: ${{ inputs.base_branch }}
        run: ./scripts/release_freeze.sh
